<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>행사 기획서 — 이벤트 코리아</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/*
  행사 기획서 자동 작성.
  행사 이야기를 칸에 채우면 기획서가 나온다 — 개요·방향·큐시트 초안·무대와 장비·인력·예산·일정·안전·준비물.
  서버 없다. 내용은 주소(#p=) 안에 통째로 담긴다.
  ?admin=1 → 우리 화면(왼쪽 칸 + 문서 + 견적서로 넘기기) / 그냥 열면 → 담당자 화면(문서만)
  「견적서로 넘기기」는 큰길이벤트기획 자동 견적서(#q=)에 규모에 맞는 품목을 실어 보낸다.
*/
:root{--stage:#0A0B10;--stage2:#12131B;--line:#262937;--line2:#33364A;--ink:#F3F2EC;--ink2:#A9AAB6;--ink3:#6E7080;
      --amber:#FFB020;--magenta:#FF3D8A;--cyan:#2FD4FF;
      --paper:#FFFFFF;--paper2:#F6F5F0;--pline:#E3E1D8;--phair:#EEECE5;--pink:#161616;--pink2:#5A5A55;--pink3:#8E8E88;
      --display:"Gothic A1","Noto Sans KR",sans-serif;--sans:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(10,11,16,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:9px;text-decoration:none}
.mark .dots{display:flex;gap:3px}.mark .dots i{width:7px;height:7px;border-radius:50%;display:block}
.mark .dots i:nth-child(1){background:var(--amber)}.mark .dots i:nth-child(2){background:var(--magenta)}.mark .dots i:nth-child(3){background:var(--cyan)}
.mark b{font-family:var(--display);font-weight:900;letter-spacing:.12em;font-size:13px}
.mark span{color:var(--ink3);font-size:13px}
.mode{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:rgba(255,176,32,.14);color:var(--amber)}
.mode.cust{background:rgba(47,212,255,.12);color:var(--cyan)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#111}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#111}
.layout{max-width:1440px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px;align-items:start}
.layout.cust{grid-template-columns:1fr;max-width:960px}
aside{background:var(--stage2);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow:auto}
aside h3{margin:16px 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink3);font-weight:600}
aside h3:first-child{margin-top:0}
label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;font:inherit;font-size:14px;background:var(--stage);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
select option{background:#15161E;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:99px;font-size:13px;cursor:pointer;user-select:none;color:var(--ink2)}
.chip input{margin:0;accent-color:var(--amber)}
.chip.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.08)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:8px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.seg label.on{background:var(--amber);color:#111;font-weight:700}
.seg input{display:none}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}

/* ── 문서 (종이) ── */
.doc{background:var(--paper);color:var(--pink);border-radius:14px;padding:clamp(22px,4vw,52px);box-shadow:0 30px 60px -40px rgba(0,0,0,.8)}
.cover{border-bottom:2px solid var(--pink);padding-bottom:22px;margin-bottom:28px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.cover .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--pink3)}
.cover h1{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,38px);line-height:1.2;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.cover .m{display:flex;gap:16px;flex-wrap:wrap;color:var(--pink2);font-size:13px}
.cover .who{text-align:right;font-size:12.5px;color:var(--pink2);line-height:1.6}
.cover .who b{font-family:var(--display);font-weight:900;display:block;font-size:14px;color:var(--pink)}
.sec{margin:30px 0 0}
.sec .n{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--pink3);font-weight:600}
.sec h2{font-family:var(--display);font-weight:900;font-size:clamp(18px,2.4vw,22px);margin:4px 0 10px;letter-spacing:-.01em}
.sec p{margin:0 0 8px;color:var(--pink2)}
.sec p b{color:var(--pink)}
.lead{font-size:clamp(15px,1.9vw,17.5px);color:var(--pink);line-height:1.6;padding:14px 18px;background:var(--paper2);border-left:4px solid var(--amber);border-radius:0 8px 8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--phair);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--pink3);font-weight:600;white-space:nowrap}
td.t{font-family:var(--mono);font-size:12.5px;color:var(--pink2);white-space:nowrap}
td.r{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.kv dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--pink3);padding-top:4px}
.kv dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12.5px;padding:4px 10px;border:1px solid var(--pline);border-radius:99px;color:var(--pink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1px solid var(--pline);border-radius:10px;padding:14px 16px}
.box h4{margin:0 0 6px;font-size:13.5px;font-family:var(--mono);letter-spacing:.06em;color:var(--pink3);font-weight:600}
.box ul{margin:0;padding-left:18px;color:var(--pink2);font-size:14px}
.box li{margin:3px 0}
.chk{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--pink2)}
.chk li::before{content:"";width:15px;height:15px;border:1.5px solid var(--pink3);border-radius:4px;flex:none;margin-top:5px}
.bud{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:center}
.bud .bar{height:8px;background:var(--phair);border-radius:99px;overflow:hidden;grid-column:1/-1;margin-bottom:6px}
.bud .bar i{display:block;height:100%;background:var(--amber)}
.bud .pc{font-family:var(--mono);font-size:12px;color:var(--pink3)}
.bud .won{font-family:var(--mono);font-size:13px;text-align:right}
.total{margin-top:10px;padding-top:10px;border-top:1px solid var(--pline);display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--display);font-weight:900;font-size:20px}
.total small{color:var(--pink3);font-size:12px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--phair);font-size:12px;color:var(--pink3)}
.cta{margin-top:26px;padding:20px;border-radius:12px;background:var(--pink);color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cta b{font-size:16px}.cta .sp{flex:1}
.cta .btn{border-color:transparent;color:#fff}.cta .btn.amber{color:#111}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;transition:.25s;background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;pointer-events:none;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}.grid2{grid-template-columns:1fr}.cover{grid-template-columns:1fr}.cover .who{text-align:left}}
@media print{body{background:#fff}.top,aside,.cta,.toast{display:none!important}.layout{display:block;padding:0}.doc{box-shadow:none;border-radius:0;padding:0}.sec{break-inside:avoid}}
</style>
  <script defer src="https://www.ai-make.co.kr/stats/stats.js" data-site="event-korea"></script>
</head>
<body>
<div class="top"><div class="top-in">
  <a class="mark" href="./"><span class="dots"><i></i><i></i><i></i></span><b>EVENT KOREA</b><span>· 행사 기획서</span></a>
  <span class="mode" id="mode">작성 화면</span>
  <span class="sp"></span>
  <button class="btn" id="b-link" type="button">🔗 링크 복사</button>
  <button class="btn" id="b-prompt" type="button" title="더 다듬고 싶을 때 Claude 에 붙여넣는 글">✎ 프롬프트 복사</button>
  <button class="btn" id="b-print" type="button">🖨 인쇄 · PDF</button>
  <button class="btn amber" id="b-quote" type="button">📄 이 기획서로 견적서 만들기</button>
</div></div>

<div class="layout" id="layout">
  <aside id="form">
    <h3>행사</h3>
    <label>행사 유형</label><select id="f-type"></select>
    <label>행사명</label><input type="text" id="f-title" placeholder="예: 2026 순천 시민의 날 기념식">
    <div class="two"><div><label>일시</label><input type="date" id="f-date"></div><div><label>시작 시각</label><input type="time" id="f-time" value="14:00"></div></div>
    <label>장소</label><input type="text" id="f-place" placeholder="예: 순천만국가정원 잔디광장">
    <label>실내 · 실외</label>
    <div class="seg" id="f-indoor"><label class="on"><input type="radio" name="io" value="out" checked>실외</label><label><input type="radio" name="io" value="in">실내</label></div>
    <label>예상 인원</label><input type="number" id="f-people" placeholder="예: 500" min="10" step="10">
    <h3>주최</h3>
    <label>주최 · 주관</label><input type="text" id="f-org" placeholder="예: 순천시 문화예술과">
    <div class="two"><div><label>담당자</label><input type="text" id="f-name" placeholder="예: 김주무관"></div><div><label>전화</label><input type="text" id="f-tel" placeholder="061-000-0000"></div></div>
    <label>이메일 <span class="hint" style="display:inline">(선택)</span></label><input type="text" id="f-email" placeholder="name@example.com">
    <h3>행사로 얻고 싶은 것</h3>
    <div class="chips" id="f-goals"></div>
    <h3>필요한 것</h3>
    <div class="chips" id="f-needs"></div>
    <p class="hint">유형을 고르면 보통 필요한 것이 미리 체크됩니다. 고치셔도 됩니다.</p>
    <h3>예산</h3>
    <select id="f-budget"></select>
    <label>특이사항 · 들은 이야기</label><textarea id="f-note" placeholder="예: 시장님 참석 확정, 우천 시 실내 체육관으로 이동, 주차 200대"></textarea>
    <p class="hint">칸을 채우는 대로 오른쪽 문서가 바뀝니다. 「링크 복사」로 보내면 담당자도 같은 문서를 봅니다.</p>
  </aside>
  <main class="doc" id="doc"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══ 유형별 뼈대 — 큐시트 초안은 [시작 분, 순서 이름, 길이 분] ══ */
var 유형들={
  festival:{이름:'지역 축제',방향:'{t}은(는) 주민과 방문객이 함께 즐기는 자리입니다. 낮에는 체험과 부스, 저녁에는 무대 공연으로 흐름을 나누고, 무대는 광장 어디서든 보이게 높이와 LED 크기를 잡습니다.',
    큐:[[0,'개막 · 내빈 소개',20],[20,'축하공연 1부',40],[60,'체험 · 부스 자유 관람 (무대 BGM · 안내 방송)',90],[150,'시민 참여 무대 · 경품 추첨',40],[190,'초청가수 공연',50],[240,'폐막 · 불꽃 연출',15]],
    필요:['무대','음향','조명','LED 전광판','MC · 사회자','가수 · 공연','텐트 · 부스','포토존 · 현수막','특수효과','발전차'],야외:true},
  ceremony:{이름:'기념식 · 준공식 · 오픈식',방향:'{t}은(는) 의전이 핵심입니다. 내빈 동선과 식순, 테이프 커팅 순서를 분 단위로 잡고, 무대는 격식 있게 단정하게 세웁니다.',
    큐:[[0,'접수 · 내빈 안내 · 착석',30],[30,'개식 · 국민의례',10],[40,'경과보고 · 기념사 · 축사',30],[70,'기념 퍼포먼스 · 테이프 커팅',15],[85,'기념 촬영',10],[95,'축하공연 · 다과',40],[135,'폐식',5]],
    필요:['무대','음향','LED 전광판','MC · 사회자','영상 중계 · 기록','포토존 · 현수막']},
  sports:{이름:'체육대회 · 명랑운동회',방향:'{t}은(는) 참가자가 주인공입니다. 진행 MC의 텐션과 운동장 전체를 덮는 음향이 성패를 가릅니다. 응원석 그늘과 급수 동선을 먼저 잡습니다.',
    큐:[[0,'집결 · 개회식 · 준비체조',30],[30,'단체 종목 1부',90],[120,'점심 · 레크리에이션',60],[180,'단체 종목 2부 · 계주',90],[270,'시상 · 폐회',30]],
    필요:['음향','MC · 사회자','텐트 · 부스','포토존 · 현수막','행사 스탭'],야외:true},
  conference:{이름:'컨퍼런스 · 포럼 · 세미나',방향:'{t}은(는) 발표가 잘 보이고 잘 들리는 것이 전부입니다. 스크린 크기, 발표자 마이크, 기록 영상이 핵심 장비이고 등록 데스크 동선을 챙깁니다.',
    큐:[[0,'등록 · 입장',30],[30,'개회 · 환영사',15],[45,'기조 발표',45],[90,'휴식',15],[105,'세션 발표 · 패널 토론',90],[195,'질의응답 · 폐회',30]],
    필요:['음향','영상 중계 · 기록','LED 전광판','MC · 사회자'],실내:true},
  award:{이름:'시상식 · 이취임식',방향:'{t}은(는) 주인공이 무대에 오르는 순간을 위한 행사입니다. 조명과 음악, 영상이 한 박자에 맞아야 하므로 큐시트를 초 단위로 잡습니다.',
    큐:[[0,'접수 · 착석',30],[30,'개식 · 내빈 소개',15],[45,'경과 영상 · 기념사',20],[65,'시상 · 이취임 의식',45],[110,'축하공연',30],[140,'기념 촬영 · 폐식',20]],
    필요:['무대','음향','조명','LED 전광판','MC · 사회자','영상 중계 · 기록','특수효과'],실내:true},
  concert:{이름:'콘서트 · 공연',방향:'{t}은(는) 출연진의 요구 장비(라이더)를 먼저 받는 데서 시작합니다. 음향 규모와 무대 높이, 관객 안전 펜스가 출발점입니다.',
    큐:[[0,'입장 · 오프닝 DJ',40],[40,'오프닝 공연',30],[70,'메인 아티스트 1부',50],[120,'브릿지 · 관객 이벤트',15],[135,'메인 아티스트 2부',50],[185,'앙코르 · 퇴장 안내',20]],
    필요:['무대','음향','조명','LED 전광판','가수 · 공연','특수효과','발전차','행사 스탭']},
  corporate:{이름:'기업 워크숍 · 송년회',방향:'{t}은(는) 직원이 즐거운 것이 목표입니다. 레크리에이션 MC, 경품, 부서별 무대가 뼈대이고, 영상 기록은 다음 해 홍보물이 됩니다.',
